# Valores de um app tipico. O que nao esta aqui e opiniao do chart, nao
# esquecimento: seguranca, rota, politica de rede e canary nao sao opcionais.

# Nome do app. Vira o nome do namespace, do Service, do Rollout e do host.
name: meu-app

image:
  repository: ghcr.io/slipalison/meu-app
  # Escrita pelo CI a cada build. Nunca 'latest': o Kyverno recusa, e com razao
  # — sem tag fixa nao existe rollback.
  tag: ""
  pullPolicy: IfNotPresent
  # Nome de um Secret `kubernetes.io/dockerconfigjson` NO NAMESPACE DO APP, para
  # quando o pacote da imagem e privado. Vazio = registry publico, que e o caso
  # de todo app cujo repositorio e publico.
  #
  # O Secret nao e criado aqui: ele nasce de um SealedSecret em
  # `homelab-gitops/apps/<app>/`, pelo mesmo motivo da credencial do banco — o
  # chart e publico e um blob selado so decifra no namespace para o qual foi
  # selado. A receita esta no README.
  pullSecret: ""

# Versao semantica do app (1.4.0), escrita pelo CI junto com image.tag. E o nome
# legivel do mesmo bit: vai para APP_VERSION, para service.version nos traces e
# para o rotulo app.kubernetes.io/version. A tag continua sendo a identidade —
# dois commits com a mesma versao ainda sao dois deploys. Vazio cai na tag.
versao: ""

# Substituem o entrypoint/cmd da imagem quando ela nao escuta onde deveria.
# O caso comum: imagem que so escuta na 80, que um usuario nao-root nao pode
# abrir. Portas abaixo de 1024 exigem privilegio, e este chart nao da nenhum.
command: []
args: []

# Porta em que o container escuta. O Service publica 80 e traduz para ca.
port: 8080

# Host publico. O TLS termina na Cloudflare; aqui dentro e HTTP.
host: ""

replicas: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Sondas. O caminho padrao serve para a maioria; troque se o app expoe outro.
probes:
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 30

canary:
  enabled: true
  # Pesos intermediarios, em porcento.
  steps: [10, 50]
  # Quanto tempo em cada passo.
  pause: 2m
  # Com analise ligada, o Rollout consulta a taxa de sucesso no Mimir em cada
  # passo e aborta sozinho se cair. Sem ela, o canary e so uma pausa.
  analysis:
    # Espera antes da primeira medicao: a janela da consulta precisa ter
    # dado dentro dela. Zero faz a analise perguntar ao Prometheus sobre um
    # pod que nasceu ha um segundo.
    initialDelay: 60s
    enabled: true
    successRate: 0.99
    interval: 1m
    count: 5

# Telemetria. O chart faz a FIACAO; quem produz o sinal e o SDK dentro do app.
#
# Nao ha injecao por webhook neste cluster. O operador do OpenTelemetry foi
# removido em 2026-09-13 porque o webhook dele ficava com certificado invalido
# a cada sync do ArgoCD e, com failurePolicy: Ignore, deixava de injetar sem
# dizer nada — um pod "instrumentado" que nao exportava nada. Ver ADR-001 no
# README deste chart.
#
# Com enabled: true o container recebe OTEL_EXPORTER_OTLP_ENDPOINT,
# OTEL_EXPORTER_OTLP_PROTOCOL, OTEL_SERVICE_NAME e OTEL_RESOURCE_ATTRIBUTES —
# os nomes padrao, que todo SDK oficial le sem configuracao extra.
instrumentation:
  enabled: true
  endpoint: http://alloy.observability.svc.cluster.local:4318
  # http/protobuf e o que o Alloy expoe em 4318. Para gRPC, trocar tambem a
  # porta para 4317 no endpoint.
  protocol: http/protobuf
  environment: producao

database:
  enabled: false
  # Nome do BANCO. O padrao e o nome do app. O nome do USUARIO nao sai daqui:
  # e sempre o nome do app, para que um values nao consiga declarar uma role
  # chamada `postgres` com senha conhecida.
  name: ""
  cluster: postgres
  clusterNamespace: databases
  # Teto de conexoes desta role. O cluster inteiro tem max_connections: 100 e
  # o Postgres nao reserva cota por usuario — um app com pool mal configurado
  # consome o cluster inteiro e derruba os outros, inclusive o proprio
  # operador. Este numero e o que impede isso.
  connectionLimit: 20

# LIGAR O BANCO NUM APP: nao basta `enabled: true`. A senha precisa existir
# selada em DOIS namespaces (em `databases`, para o operador criar a role; no
# namespace do app, para o pod ler). O script faz os dois de uma vez e nunca
# mostra a senha:
#
#   ./setup-k8s-platform.sh --only pgapp --pg-app meu-app
#
# Sem isso o pod nasce em CreateContainerConfigError e a role nao e criada.

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Variaveis simples. Segredo vai por SealedSecret, nunca aqui.
env: []
# - name: LOG_LEVEL
#   value: info

envFrom: []
# - secretRef:
#     name: meu-app-segredos

# Destinos externos que o app precisa alcancar. Tudo o que nao estiver aqui e
# barrado pela NetworkPolicy — inclusive coisas que funcionavam antes de a
# politica existir.
egress: []
# - host: api.externa.com
#   port: 443

# Rotulo obrigatorio pelo Kyverno: de quem e este app.
owner: alison

podAnnotations: {}
nodeSelector: {}
tolerations: []
