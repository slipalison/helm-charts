# Valores de um app tipico. O que nao esta aqui e opiniao do chart, nao
# esquecimento: seguranca, rota, politica de rede e canary nao sao opcionais.

# Nome do app. Vira o nome do namespace, do Service, do Rollout e do host.
name: meu-app

image:
  repository: ghcr.io/slipalison/meu-app
  # Escrita pelo CI a cada build. Nunca 'latest': o Kyverno recusa, e com razao
  # — sem tag fixa nao existe rollback.
  tag: ""
  pullPolicy: IfNotPresent
  # Nome de um Secret `kubernetes.io/dockerconfigjson` NO NAMESPACE DO APP, para
  # quando o pacote da imagem e privado. Vazio = registry publico, que e o caso
  # de todo app cujo repositorio e publico.
  #
  # O Secret nao e criado aqui: ele nasce de um SealedSecret em
  # `homelab-gitops/apps/<app>/`, pelo mesmo motivo da credencial do banco — o
  # chart e publico e um blob selado so decifra no namespace para o qual foi
  # selado. A receita esta no README.
  pullSecret: ""

# Versao semantica do app (1.4.0), escrita pelo CI junto com image.tag. E o nome
# legivel do mesmo bit: vai para APP_VERSION, para service.version nos traces e
# para o rotulo app.kubernetes.io/version. A tag continua sendo a identidade —
# dois commits com a mesma versao ainda sao dois deploys. Vazio cai na tag.
versao: ""

# Substituem o entrypoint/cmd da imagem quando ela nao escuta onde deveria.
# O caso comum: imagem que so escuta na 80, que um usuario nao-root nao pode
# abrir. Portas abaixo de 1024 exigem privilegio, e este chart nao da nenhum.
command: []
args: []

# Porta em que o container escuta. O Service publica 80 e traduz para ca.
port: 8080

# Host publico. O TLS termina na Cloudflare; aqui dentro e HTTP.
host: ""

replicas: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Sondas. O caminho padrao serve para a maioria; troque se o app expoe outro.
probes:
  # Porta das duas sondas. Ausente = `port`, a do trafego, que e o caso de quase
  # todo app. Para o app que serve as sondas num listener INTERNO, que o gateway
  # nao alcanca — o basalto responde /healthz e /readyz so na 9090, e na 8080
  # devolve 404. Comentado de proposito: a ausencia e o padrao, e um `port:`
  # vazio aqui seria recusado pelo schema (tem de ser inteiro).
  # port: 9090
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 30

canary:
  enabled: true
  # Pesos intermediarios, em porcento.
  steps: [10, 50]
  # Quanto tempo em cada passo.
  pause: 2m
  # Com analise ligada, o Rollout consulta a taxa de sucesso no Mimir em cada
  # passo e aborta sozinho se cair. Sem ela, o canary e so uma pausa.
  analysis:
    # Espera antes da primeira medicao: a janela da consulta precisa ter
    # dado dentro dela. Zero faz a analise perguntar ao Prometheus sobre um
    # pod que nasceu ha um segundo.
    initialDelay: 60s
    enabled: true
    successRate: 0.99
    interval: 1m
    count: 5

# Telemetria. O chart faz a FIACAO; quem produz o sinal e o SDK dentro do app.
#
# Nao ha injecao por webhook neste cluster. O operador do OpenTelemetry foi
# removido em 2026-09-13 porque o webhook dele ficava com certificado invalido
# a cada sync do ArgoCD e, com failurePolicy: Ignore, deixava de injetar sem
# dizer nada — um pod "instrumentado" que nao exportava nada. Ver ADR-001 no
# README deste chart.
#
# Com enabled: true o container recebe OTEL_EXPORTER_OTLP_ENDPOINT,
# OTEL_EXPORTER_OTLP_PROTOCOL, OTEL_SERVICE_NAME e OTEL_RESOURCE_ATTRIBUTES —
# os nomes padrao, que todo SDK oficial le sem configuracao extra.
instrumentation:
  enabled: true
  endpoint: http://alloy.observability.svc.cluster.local:4318
  # http/protobuf e o que o Alloy expoe em 4318. Para gRPC, trocar tambem a
  # porta para 4317 no endpoint.
  protocol: http/protobuf
  environment: producao

database:
  enabled: false
  # Nome do BANCO. O padrao e o nome do app. O nome do USUARIO nao sai daqui:
  # e sempre o nome do app, para que um values nao consiga declarar uma role
  # chamada `postgres` com senha conhecida.
  name: ""
  cluster: postgres
  clusterNamespace: databases
  # Teto de conexoes desta role. O cluster inteiro tem max_connections: 100 e
  # o Postgres nao reserva cota por usuario — um app com pool mal configurado
  # consome o cluster inteiro e derruba os outros, inclusive o proprio
  # operador. Este numero e o que impede isso.
  connectionLimit: 20
  # Secret que o APP le em producao (o Rollout, e os workers que nao trocam o
  # seu). Vazio = `<app>-db`, a senha da role `<app>`, que e DONA do banco. E o
  # campo para o app que roda com o Job de migracao: o Job fica com a role
  # dona, e o app passa a uma role sem DDL, criada fora do chart. Mesmo
  # formato do `<app>-db`. Ignorado no preview (la e o banco efemero).
  secret: ""

# LIGAR O BANCO NUM APP: nao basta `enabled: true`. A senha precisa existir
# selada em DOIS namespaces (em `databases`, para o operador criar a role; no
# namespace do app, para o pod ler). O script faz os dois de uma vez e nunca
# mostra a senha:
#
#   ./setup-k8s-platform.sh --only pgapp --pg-app meu-app
#
# Sem isso o pod nasce em CreateContainerConfigError e a role nao e criada.

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Variaveis simples. Segredo vai por SealedSecret, nunca aqui.
env: []
# - name: LOG_LEVEL
#   value: info

envFrom: []
# - secretRef:
#     name: meu-app-segredos

# Destinos externos que o app precisa alcancar. Tudo o que nao estiver aqui e
# barrado pela NetworkPolicy — inclusive coisas que funcionavam antes de a
# politica existir.
egress: []
# - host: api.externa.com
#   port: 443

# Rotulo obrigatorio pelo Kyverno: de quem e este app.
owner: alison

# AMBIENTE DE PREVIEW — um ambiente efemero por pull request.
#
# `numero` e `tag` sao escritos SO pelo ApplicationSet `previews` do
# homelab-gitops, a partir do pull request; nunca a mao. Com `numero` vazio o
# chart e o de producao, e o render sai igual ao de antes deste bloco existir.
#
# No preview o chart muda, e so isto:
#   - nome, namespace e host viram `pr-<numero>-<name>` (e `host` e ignorado);
#   - a imagem e `pr-<numero>-<7 do head>`, e ela vira a versao anunciada;
#   - uma replica, sem canary, sem HPA, sem PDB;
#   - com `database.enabled`, um Postgres efemero DENTRO do namespace, e nunca o
#     banco de producao — que fica ate fora de alcance de rede;
#   - `preview.env` e `preview.secretEnv` sobrepoem o `env` pelo nome.
# Desenho completo: distros-setup/proxmox/PLANO-PREVIEW.md.
preview:
  numero: ""
  tag: ""
  # Diferencas do preview em relacao a producao, como MAPA nome: valor. Um
  # mapa, e nao lista, porque o Helm substitui listas inteiras: um `env:` aqui
  # apagaria as variaveis de producao. Ex.: o client_id de um login de teste.
  env: {}
  # CREDENCIAIS PROPRIAS DO PREVIEW, como MAPA nome: {secret, key}. Cada
  # variavel aqui SUBSTITUI a de mesmo nome do `env` de producao (ou entra, se
  # nao existia) com um `secretKeyRef` para um Secret DO PREVIEW. E o jeito de o
  # preview receber chaves e credenciais de teste em vez de uma copia do Secret
  # de producao: com a variavel coberta aqui, o Secret de producao nem aparece
  # no render do preview.
  #
  # O Secret nomeado precisa existir no namespace `pr-*`. O chart nao o cria
  # (o chart e publico, e um SealedSecret so decifra no namespace para o qual
  # foi selado): o caminho e um Secret SO DE TESTE no namespace de producao do
  # app, com o rotulo de copia do Kyverno. Ver o README.
  #
  #   secretEnv:
  #     CHAVE_DA_API:
  #       secret: meu-app-preview
  #       key: CHAVE_DA_API
  #       optional: false     # opcional; o padrao do Kubernetes e false
  secretEnv: {}
  banco:
    # A mesma imagem do cluster de producao (homelab-gitops,
    # platform/postgres/manifests/cluster.yaml). Mudou la, muda aqui.
    imagem: ghcr.io/cloudnative-pg/postgresql:17.6
    tamanho: 1Gi
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 256Mi

# WORKERS — Deployments extras com a MESMA imagem e `command`/`args` proprios:
# o processo que consome uma fila, por exemplo. Cada chave e um worker, e o
# Deployment se chama `<name>-<chave>`. Mapa, e nao lista, para o values do
# preview poder mudar um campo de um worker sem reescrever os outros.
#
# O worker herda do app a imagem (no preview, a do PR), o pull secret, o
# securityContext, a NetworkPolicy, o sidecar e o `env` inteiro (versao,
# OpenTelemetry, `env`, as sobreposicoes do preview e o banco). Nao tem
# Service nem rota: ninguem de fora fala com ele, e a AuthorizationPolicy dele
# so deixa passar as portas do sidecar. No preview, uma replica.
#
#   workers:
#     fila:
#       args: ["worker"]          # obrigatorio: command ou args
#       replicas: 1               # padrao 1
#       port: 9090                # sondas e metricas; padrao probes.port, ou port
#       resources:                # padrao: os do app. O Kyverno exige os tres
#         requests: {cpu: 10m, memory: 32Mi}
#         limits: {memory: 128Mi}
#       env:                      # por cima do env do app, pelo nome
#         - name: PAPEL
#           value: fila
#       database:
#         secret: meu-app-fila-db # credencial propria; padrao a do app
#       probes: {}                # sobrepoe `probes` campo a campo
#       podAnnotations: {}        # sobrepoe `podAnnotations`
workers: {}

# JOB DE MIGRACAO — o esquema do banco muda aqui, com uma credencial so dele.
# O chart recusa o mesmo Secret no Job e no app (`database.secret`) ou num
# worker. Que o app fique sem DDL depende de a credencial DELE ser de uma role
# sem DDL, criada fora do chart. Exige `database.enabled`.
#
# Em producao e um gancho PreSync do Argo CD: roda e termina antes de qualquer
# outro objeto do sync, e se falha o sync para. No preview e um gancho Sync
# depois do banco efemero, com o app e os workers uma onda depois, contra o
# banco efemero e com a credencial dele.
#
# O Job recebe a versao, o OpenTelemetry, o endereco do banco, a credencial de
# `migration.database.secret` e `migration.env` — e NAO o `env` nem o
# `envFrom` do app.
migration:
  enabled: false
  # Obrigatorio: command ou args. Sem eles o Job rodaria o app, que nao termina.
  command: []
  args: []
  # Por cima do que o chart escreve, pelo nome. Nao pode nomear variavel do
  # chart (APP_VERSION, OTEL_*, PG*, DATABASE_URL...).
  env: []
  # Vazio = os do app. O Kyverno exige requests.cpu, requests.memory e
  # limits.memory.
  resources: {}
  database:
    # Secret NO NAMESPACE DO APP com a credencial da role dona do esquema, no
    # mesmo formato do `<app>-db`: username, password, DATABASE_URL e
    # ConnectionStrings__Default. Obrigatorio em producao, e outro que o do
    # app (`database.secret`) e o de cada worker. No preview e
    # ignorado (a credencial e a do banco efemero).
    secret: ""
  # 0: uma migracao que falha nao e repetida pelo Job. Quem tenta de novo e o
  # retry do sync do Argo CD, que recria o Job.
  backoffLimit: 0
  activeDeadlineSeconds: 600

podAnnotations: {}
nodeSelector: {}
tolerations: []
