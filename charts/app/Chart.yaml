apiVersion: v2
name: app
description: >-
  Caminho dourado para publicar um servico no cluster: Rollout canary com
  analise por metrica, rota no Istio, NetworkPolicy e AuthorizationPolicy
  fechadas por padrao, fiacao do OpenTelemetry e banco no CloudNativePG.
type: application
# 0.0.0 DE PROPOSITO. A versao real vem dos commits (Conventional Commits) e e
# carimbada pelo CI com `helm package --version` — o ArgoCD le o pacote no
# GHCR, nao este arquivo. Helm exige o campo; ele nao e a fonte de nada.
version: 0.0.0
# A versao da aplicacao vem do values de cada app, nao daqui.
appVersion: "n/a"
keywords:
  - istio
  - argo-rollouts
  - canary
  - opentelemetry
home: https://github.com/slipalison/helm-charts
maintainers:
  - name: Alison Amorim
