apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- include "app.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.instrumentation.enabled }}
        # O operador do OpenTelemetry le esta anotacao, injeta o agente da
        # linguagem e aponta o OTLP para o Alloy. O app nao muda.
        instrumentation.opentelemetry.io/inject-{{ .Values.instrumentation.language }}: "observability/default"
        {{- end }}
    spec:
      serviceAccountName: {{ include "app.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "app.selectorLabels" . | nindent 20 }}
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag e obrigatorio - o CI escreve este valor a cada build" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.database.enabled }}
          envFrom:
            - secretRef:
                # Criado pelo CloudNativePG com o usuario e a senha do banco.
                name: {{ .Values.database.cluster }}-app
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          volumeMounts:
            # O rootfs e somente leitura; /tmp precisa existir para quase todo
            # runtime moderno.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    {{- if .Values.canary.enabled }}
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: {{ include "app.name" . }}
          destinationRule:
            name: {{ include "app.name" . }}
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        {{- range .Values.canary.steps }}
        - setWeight: {{ . }}
        {{- if $.Values.canary.analysis.enabled }}
        - analysis:
            templates:
              - templateName: {{ include "app.name" $ }}-taxa-de-sucesso
        {{- end }}
        - pause:
            duration: {{ $.Values.canary.pause }}
        {{- end }}
    {{- else }}
    # Sem canary: troca direta, com no maximo um pod indisponivel por vez.
    blueGreen:
      activeService: {{ include "app.name" . }}
      autoPromotionEnabled: true
    {{- end }}
