{{- include "app.valoresAposentados" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- include "app.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "app.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "app.selectorLabels" . | nindent 20 }}
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag e obrigatorio - o CI escreve este valor a cada build" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            # A versao chega ao app como APP_VERSION, sempre. Sem isto, durante
            # um canary nao ha como a propria aplicacao dizer qual versao
            # respondeu — e um canary que nao se enxerga nao serve para decidir
            # nada. E a versao semantica que a esteira escreve (1.4.0); sem ela,
            # a tag da imagem (sha-<commit>).
            - name: APP_VERSION
              value: {{ .Values.versao | default .Values.image.tag | quote }}
            - name: APP_NAME
              value: {{ include "app.name" . | quote }}
            {{- if .Values.instrumentation.enabled }}
            # Fiacao do OpenTelemetry, escrita aqui e nao injetada por webhook.
            #
            # Ate 0.1.4 este chart punha a anotacao que mandava o operador do
            # OpenTelemetry injetar o agente no pod. O webhook desse operador
            # estava com "tls: bad certificate" e failurePolicy: Ignore — o pod
            # nascia sem instrumentacao NENHUMA e nada no cluster reclamava. Um
            # componente que falha calado e pior do que um componente ausente.
            # O operador foi removido do cluster; ver ADR-001.
            #
            # Sao os nomes padrao do OpenTelemetry: qualquer SDK oficial os le
            # sem configuracao. O app so precisa iniciar o SDK — e se nao
            # iniciar, estas variaveis nao fazem mal a ninguem.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.instrumentation.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.instrumentation.protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "app.name" . | quote }}
            # service.version e o que liga um trace a uma versao durante o
            # canary; sem ela os dois lados do rollout viram o mesmo servico.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version={{ .Values.versao | default .Values.image.tag }},service.namespace={{ include "app.name" . }},k8s.namespace.name={{ include "app.name" . }},deployment.environment={{ .Values.instrumentation.environment }}"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.envFrom .Values.database.enabled }}
          # UM envFrom so. Antes havia dois blocos independentes, e um app com
          # `envFrom` proprio E banco renderizava a chave duas vezes no mesmo
          # container: YAML com chave repetida, o ultimo vence, o primeiro some
          # sem erro nenhum.
          envFrom:
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.database.enabled }}
            - secretRef:
                # Criado pelo CloudNativePG com o usuario e a senha do banco.
                name: {{ .Values.database.cluster }}-app
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          volumeMounts:
            # O rootfs e somente leitura; /tmp precisa existir para quase todo
            # runtime moderno.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    {{- if .Values.canary.enabled }}
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: {{ include "app.name" . }}
          destinationRule:
            name: {{ include "app.name" . }}
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        {{- range .Values.canary.steps }}
        - setWeight: {{ . }}
        {{- if $.Values.canary.analysis.enabled }}
        - analysis:
            templates:
              - templateName: {{ include "app.name" $ }}-taxa-de-sucesso
        {{- end }}
        - pause:
            duration: {{ $.Values.canary.pause }}
        {{- end }}
    {{- else }}
    # Sem canary: troca direta, com no maximo um pod indisponivel por vez.
    blueGreen:
      activeService: {{ include "app.name" . }}
      autoPromotionEnabled: true
    {{- end }}
