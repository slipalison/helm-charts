{{- include "app.valoresAposentados" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with include "app.ondaDosWorkloads" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "app.replicas" . }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- include "app.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "app.name" . }}
      {{- with .Values.image.pullSecret }}
      # Registry privado. Quem puxa a imagem e o kubelet, e nao o pod: este
      # Secret nao passa por NetworkPolicy nem pela ServiceAccount do app, e
      # precisa existir no MESMO namespace do Rollout — Secret nao atravessa
      # namespace. Sem ele, um pacote privado no GHCR da ImagePullBackOff com
      # "denied", que se le como imagem inexistente.
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "app.selectorLabels" . | nindent 20 }}
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ include "app.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            {{- include "app.env" (dict "ctx" . "segredoBanco" (include "app.dbSecret" .)) | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ include "app.probePort" . }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ include "app.probePort" . }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          volumeMounts:
            # O rootfs e somente leitura; /tmp precisa existir para quase todo
            # runtime moderno.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    {{- if include "app.canary" . }}
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: {{ include "app.name" . }}
          destinationRule:
            name: {{ include "app.name" . }}
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        {{- range .Values.canary.steps }}
        - setWeight: {{ . }}
        {{- if $.Values.canary.analysis.enabled }}
        - analysis:
            templates:
              - templateName: {{ include "app.name" $ }}-taxa-de-sucesso
        {{- end }}
        - pause:
            duration: {{ $.Values.canary.pause }}
        {{- end }}
    {{- else }}
    # Sem canary: troca direta, com no maximo um pod indisponivel por vez.
    blueGreen:
      activeService: {{ include "app.name" . }}
      autoPromotionEnabled: true
    {{- end }}
