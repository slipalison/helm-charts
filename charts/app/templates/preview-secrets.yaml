{{- /*
SECRETS PERMITIDOS NO PREVIEW (`preview.secretsPermitidos`), ligado por opcao.

`preview.secretEnv` troca a variavel que ele cobre, e so ela. Uma referencia a
Secret que ele NAO cobre continua no preview com o nome de producao: uma
variavel que so o worker tem, o `migration.env`, o `envFrom`, um `env` do app
esquecido. Se o Secret de producao tiver o rotulo de copia, o preview passa a
le-lo; se nao tiver, o pod do preview nao nasce. Nos dois casos o erro so
aparece no cluster.

Com a lista presente (mesmo vazia), o render do PREVIEW falha se algum pod do
app (o Rollout, um worker, o Job de migracao) referenciar um Secret fora de
`banco-app` (o do banco efemero) e dos nomes da lista. Os `secret` de
`preview.secretEnv` tambem tem de estar na lista: o mapa se mescla entre as
camadas do preview, e uma delas e o values do proprio PR, entao um Secret de
producao escrito ali por engano nao entra sozinho. E o pod com a anotacao
`sidecar.istio.io/userVolume` e recusado: ela monta volume no sidecar, num
JSON que o chart nao confere.
Le o pod como ele sai do render, e nao o values (o helper
`app.secretsDosPods`): `env` (`secretKeyRef`), `envFrom` (`secretRef`) e
volumes (`secret` e `projected`), em todo container e initContainer. Nao olha
`imagePullSecrets`: quem le o pull secret e o kubelet, e nao o processo do app.

Este arquivo nao gera objeto nenhum: ou o render passa igual, ou ele para.
Sem a lista, ou em producao, nada daqui roda.
*/ -}}
{{- if and (include "app.emPreview" .) (kindIs "slice" .Values.preview.secretsPermitidos) }}
{{- range $nome, $ref := .Values.preview.secretEnv | default dict }}
{{- if not (has $ref.secret $.Values.preview.secretsPermitidos) }}
{{- fail (printf "preview.secretsPermitidos: preview.secretEnv.%s le o Secret '%s', que nao esta na lista. Acrescente-o a preview.secretsPermitidos se ele for so de teste." $nome $ref.secret) }}
{{- end }}
{{- end }}
{{- $permitidos := concat (list "banco-app") .Values.preview.secretsPermitidos }}
{{- $lidos := include "app.secretsDosPods" (dict "ctx" . "arquivos" (list "rollout.yaml" "workers.yaml" "migration.yaml")) | fromYaml }}
{{- range $u := $lidos.userVolume }}
{{- fail (printf "preview.secretsPermitidos: %s usa a anotacao sidecar.istio.io/userVolume, que monta volume no sidecar; o chart nao confere o que ela le. Tire a anotacao do preview." $u.onde) }}
{{- end }}
{{- range $r := $lidos.refs }}
{{- if not (has $r.secret $permitidos) }}
{{- fail (printf "preview.secretsPermitidos: %s le o Secret '%s' (%s), que nao esta na lista. No preview, cubra a variavel com preview.secretEnv, ou acrescente o Secret a preview.secretsPermitidos se ele for so de teste." $r.onde $r.secret $r.caminho) }}
{{- end }}
{{- end }}
{{- end }}
