{{- /*
SECRETS PERMITIDOS NO PREVIEW (`preview.secretsPermitidos`), ligado por opcao.

`preview.secretEnv` troca a variavel que ele cobre, e so ela. Uma referencia a
Secret que ele NAO cobre continua no preview com o nome de producao: uma
variavel que so o worker tem, o `migration.env`, o `envFrom`, um `env` do app
esquecido. Se o Secret de producao tiver o rotulo de copia, o preview passa a
le-lo; se nao tiver, o pod do preview nao nasce. Nos dois casos o erro so
aparece no cluster.

Com a lista presente (mesmo vazia), o render do PREVIEW falha se algum pod do
app (o Rollout, um worker, o Job de migracao) referenciar um Secret fora de:
  - `banco-app`, o do banco efemero;
  - os `secret` de `preview.secretEnv`;
  - os nomes da lista.
Le o pod como ele sai do render, e nao o values: `env` (`secretKeyRef`),
`envFrom` (`secretRef`) e volumes (`secret` e `projected`), em todo container
e initContainer. Nao olha `imagePullSecrets`: quem le o pull secret e o
kubelet, e nao o processo do app.

Este arquivo nao gera objeto nenhum: ou o render passa igual, ou ele para.
Sem a lista, ou em producao, nada daqui roda.
*/ -}}
{{- if and (include "app.emPreview" .) (kindIs "slice" .Values.preview.secretsPermitidos) }}
{{- $permitidos := list "banco-app" }}
{{- range $_, $ref := .Values.preview.secretEnv | default dict }}
{{- $permitidos = append $permitidos $ref.secret }}
{{- end }}
{{- $permitidos = concat $permitidos .Values.preview.secretsPermitidos }}
{{- range $arq := list "rollout.yaml" "workers.yaml" "migration.yaml" }}
{{- $texto := include (printf "%s/%s" $.Template.BasePath $arq) $ }}
{{- range $doc := regexSplit "(?m)^---[ \t]*$" $texto -1 }}
{{- $o := fromYaml $doc }}
{{- $pod := dig "spec" "template" "spec" dict $o }}
{{- if $pod }}
{{- $onde := printf "%s/%s" (dig "kind" "?" $o) (dig "metadata" "name" "?" $o) }}
{{- $refs := list }}
{{- range $c := concat (dig "containers" list $pod) (dig "initContainers" list $pod) }}
{{- range $e := dig "env" list $c }}
{{- with dig "valueFrom" "secretKeyRef" "name" "" $e }}
{{- $refs = append $refs (list . (printf "env %s" $e.name)) }}
{{- end }}
{{- end }}
{{- range $e := dig "envFrom" list $c }}
{{- with dig "secretRef" "name" "" $e }}
{{- $refs = append $refs (list . "envFrom") }}
{{- end }}
{{- end }}
{{- end }}
{{- range $v := dig "volumes" list $pod }}
{{- with dig "secret" "secretName" "" $v }}
{{- $refs = append $refs (list . (printf "volume %s" $v.name)) }}
{{- end }}
{{- range $s := dig "projected" "sources" list $v }}
{{- with dig "secret" "name" "" $s }}
{{- $refs = append $refs (list . (printf "volume %s" $v.name)) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $r := $refs }}
{{- if not (has (index $r 0) $permitidos) }}
{{- fail (printf "preview.secretsPermitidos: %s le o Secret '%s' (%s), que nao esta na lista. No preview, cubra a variavel com preview.secretEnv, ou acrescente o Secret a preview.secretsPermitidos se ele for so de teste." $onde (index $r 0) (index $r 1)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
