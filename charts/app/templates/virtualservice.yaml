apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ include "app.host" . }}
  gateways:
    - istio-system/main
  http:
    - name: primary
      route:
        # Os pesos sao o estado inicial. A partir do primeiro deploy quem
        # escreve aqui e o controlador do Argo Rollouts.
        - destination:
            host: {{ include "app.name" . }}
            subset: stable
            port:
              number: 80
          weight: 100
        - destination:
            host: {{ include "app.name" . }}
            subset: canary
            port:
              number: 80
          weight: 0
