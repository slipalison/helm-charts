name: CI

# Versao pelos commits, lint, e — na main — o pacote no GHCR, a tag e a release.
# Tudo num run so. O antigo release.yml esperava a tag chegar (`on: push:
# tags`); tag criada pelo GITHUB_TOKEN nao dispara workflow nenhum, e agora e a
# esteira quem cria a tag, entao ele saiu.
#
# A VERSAO DO CHART NAO ESTA EM Chart.yaml. La e 0.0.0. `helm package --version`
# carimba no pacote a versao que a esteira calculou dos commits (feat -> minor,
# feat! -> major, o resto -> patch), e e o pacote que o ArgoCD le — nao o
# arquivo. Ninguem escreve numero, e nenhum commit de bot entra na main.
#
# Um so chart aqui, uma versao por repositorio. Se um dia houver dois, a versao
# passa a precisar de escopo por caminho — e ai e outro desenho.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versao:
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/versao.yml@main

  lint:
    name: Lint e template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint charts/app
      - name: helm template com os valores de exemplo
        # Lint nao renderiza. Um template que so quebra com valores reais passa
        # pelo lint sem reclamar.
        run: |
          set -euo pipefail
          helm template exemplo charts/app \
            --set name=exemplo \
            --set owner=alison \
            --set image.repository=ghcr.io/slipalison/exemplo \
            --set image.tag=sha-abc1234 \
            --set versao=1.2.3 > /tmp/render.yaml
          # A versao tem de chegar aos tres lugares; sem ela, a tag.
          grep -q 'app.kubernetes.io/version: "1.2.3"' /tmp/render.yaml
          grep -q 'service.version=1.2.3,' /tmp/render.yaml
          helm template exemplo charts/app \
            --set name=exemplo \
            --set owner=alison \
            --set image.repository=ghcr.io/slipalison/exemplo \
            --set image.tag=sha-abc1234 > /tmp/render-sem-versao.yaml
          grep -q 'app.kubernetes.io/version: "sha-abc1234"' /tmp/render-sem-versao.yaml
          # `probes.port` nas duas direcoes. Sem o campo, as DUAS sondas batem
          # em `port` — e o que mantem o render de todo app igual ao de antes
          # dele existir. Com o campo, mudam as duas sondas e mais nenhuma
          # linha: a porta da NetworkPolicy, que tambem e `port`, fica onde
          # esta. O arquivo inteiro tem tres `port: 8080`, entao a leitura e
          # pelas linhas das sondas, e nao pela contagem da porta.
          sondas() { grep -A3 -E '^ +(readiness|liveness)Probe:$' "$1" | grep -oE 'port: [0-9]+' | paste -sd, -; }
          [ "$(sondas /tmp/render-sem-versao.yaml)" = "port: 8080,port: 8080" ]
          helm template exemplo charts/app \
            --set name=exemplo \
            --set owner=alison \
            --set image.repository=ghcr.io/slipalison/exemplo \
            --set image.tag=sha-abc1234 \
            --set probes.port=9090 > /tmp/render-sondas.yaml
          [ "$(sondas /tmp/render-sondas.yaml)" = "port: 9090,port: 9090" ]
          [ "$(diff /tmp/render-sem-versao.yaml /tmp/render-sondas.yaml | grep -c '^[<>]')" = 4 ]

      - name: Modo preview
        # O preview e o mesmo chart com um bloco a mais. Duas perguntas:
        # producao continua igual, e o preview sai com o que o desenho promete
        # (distros-setup/proxmox/PLANO-PREVIEW.md). O render de producao dos
        # apps reais contra a versao anterior foi conferido byte a byte antes do
        # merge; aqui fica o que da para afirmar sem a versao anterior.
        run: |
          set -euo pipefail
          base=(--set name=exemplo --set owner=alison
                --set image.repository=ghcr.io/slipalison/exemplo
                --set image.tag=sha-abc1234 --set versao=1.2.3
                --set host=exemplo.alisonamorim.com
                --set database.enabled=true --set autoscaling.enabled=true
                --set 'env[0].name=A' --set 'env[0].value=producao'
                --set 'env[1].name=B' --set 'env[1].value=fica')
          helm template exemplo charts/app "${base[@]}" > /tmp/prod.yaml
          # Bloco presente mas vazio = producao, sem uma linha de diferenca.
          helm template exemplo charts/app "${base[@]}" --set preview.numero= > /tmp/prod-vazio.yaml
          diff /tmp/prod.yaml /tmp/prod-vazio.yaml

          helm template pr-42-exemplo charts/app "${base[@]}" \
            --set preview.numero=42 --set preview.tag=pr-42-abcdef0 \
            --set preview.env.A=preview --set preview.env.C=nova > /tmp/pv.yaml
          python3 - <<'FIMPY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/pv.yaml")) if d]
          kinds = sorted(d["kind"] for d in docs)
          por = {d["kind"]: d for d in docs}
          def falha(m): raise SystemExit("FALHA: " + m)
          for d in docs:
              ns = d["metadata"].get("namespace", d["metadata"]["name"])
              if ns != "pr-42-exemplo": falha(f'{d["kind"]} fora do namespace do preview: {ns}')
          for k in ("DatabaseRole", "Database", "PodDisruptionBudget", "HorizontalPodAutoscaler", "AnalysisTemplate"):
              if k in kinds: falha(f"{k} nao existe no preview")
          if "Cluster" not in kinds: falha("banco efemero ausente")
          ro = por["Rollout"]; c = ro["spec"]["template"]["spec"]["containers"][0]
          if ro["spec"]["replicas"] != 1: falha("preview tem uma replica")
          if "blueGreen" not in ro["spec"]["strategy"]: falha("preview nao tem canary")
          if not c["image"].endswith(":pr-42-abcdef0"): falha("imagem do PR")
          env = [(e["name"], e.get("value")) for e in c["env"]]
          nomes = [n for n, _ in env]
          if ("A", "preview") not in env or ("B", "fica") not in env or ("C", "nova") not in env:
              falha(f"preview.env mescla pelo nome: {env}")
          if nomes.count("A") != 1: falha("variavel duplicada")
          if por["VirtualService"]["spec"]["hosts"] != ["pr-42-exemplo.alisonamorim.com"]:
              falha("o host de producao nao pode ir para o preview")
          lab = por["Namespace"]["metadata"]["labels"]
          if "db-access" in lab: falha("o preview nao alcanca o banco de producao")
          if lab.get("preview.alisonamorim.com/origem") != "exemplo": falha("rotulo de origem")
          print("preview ok:", kinds)
          FIMPY

          # E o que o preview tem de RECUSAR, cada um com o seu motivo.
          recusa() { if helm template x charts/app "${base[@]}" "$@" >/dev/null 2>&1; then echo "::error::aceitou: $*"; exit 1; fi; }
          recusa --set preview.numero=42 --set preview.tag=pr-41-abcdef0  # tag de outro PR
          recusa --set preview.numero=42 --set preview.tag=sha-abcdef0    # imagem de producao
          recusa --set preview.numero=42                                  # sem tag
          recusa --set preview.numero=1234 --set preview.tag=pr-1234-abcdef0 \
                 --set name=um-nome-de-aplicacao-comprido-demais         # passa de 40

  publicar:
    name: Publicar OCI
    needs: [versao, lint]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.versao.outputs.salto != 'nenhum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Login no GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io -u "$USUARIO" --password-stdin
      - name: Empacotar e enviar
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          set -euo pipefail
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versao invalida: $VERSAO"; exit 1; }
          helm package charts/app --version "$VERSAO"
          helm push "app-$VERSAO.tgz" oci://ghcr.io/slipalison/charts
          {
            echo "## Chart"
            echo ""
            echo "\`oci://ghcr.io/slipalison/charts/app\` versao **$VERSAO**"
            echo ""
            echo "Para usar: \`targetRevision: $VERSAO\` em apps/applicationset.yaml do homelab-gitops — o unico lugar; o validar-apps e o ApplicationSet previews leem dali."
          } >> "$GITHUB_STEP_SUMMARY"

  lancar:
    # Depois do pacote: a tag e a prova de que aquela versao esta no GHCR.
    needs: [versao, lint, publicar]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.versao.outputs.salto != 'nenhum'
    permissions:
      contents: write
      packages: write
    uses: slipalison/github-workflows/.github/workflows/lancar.yml@main
    with:
      versao: ${{ needs.versao.outputs.versao }}
      tag: ${{ needs.versao.outputs.tag }}
