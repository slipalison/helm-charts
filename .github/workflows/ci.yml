name: CI

# Versao pelos commits, lint, e — na main — o pacote no GHCR, a tag e a release.
# Tudo num run so. O antigo release.yml esperava a tag chegar (`on: push:
# tags`); tag criada pelo GITHUB_TOKEN nao dispara workflow nenhum, e agora e a
# esteira quem cria a tag, entao ele saiu.
#
# A VERSAO DO CHART NAO ESTA EM Chart.yaml. La e 0.0.0. `helm package --version`
# carimba no pacote a versao que a esteira calculou dos commits (feat -> minor,
# feat! -> major, o resto -> patch), e e o pacote que o ArgoCD le — nao o
# arquivo. Ninguem escreve numero, e nenhum commit de bot entra na main.
#
# Um so chart aqui, uma versao por repositorio. Se um dia houver dois, a versao
# passa a precisar de escopo por caminho — e ai e outro desenho.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versao:
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/versao.yml@main

  lint:
    name: Lint e template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint charts/app
      - name: helm template com os valores de exemplo
        # Lint nao renderiza. Um template que so quebra com valores reais passa
        # pelo lint sem reclamar.
        run: |
          set -euo pipefail
          helm template exemplo charts/app \
            --set name=exemplo \
            --set owner=alison \
            --set image.repository=ghcr.io/slipalison/exemplo \
            --set image.tag=sha-abc1234 \
            --set versao=1.2.3 > /tmp/render.yaml
          # A versao tem de chegar aos tres lugares; sem ela, a tag.
          grep -q 'app.kubernetes.io/version: "1.2.3"' /tmp/render.yaml
          grep -q 'service.version=1.2.3,' /tmp/render.yaml
          helm template exemplo charts/app \
            --set name=exemplo \
            --set owner=alison \
            --set image.repository=ghcr.io/slipalison/exemplo \
            --set image.tag=sha-abc1234 > /tmp/render-sem-versao.yaml
          grep -q 'app.kubernetes.io/version: "sha-abc1234"' /tmp/render-sem-versao.yaml
          # `probes.port` nas duas direcoes. Sem o campo, as DUAS sondas batem
          # em `port` — e o que mantem o render de todo app igual ao de antes
          # dele existir. Com o campo, mudam as duas sondas e mais nenhuma
          # linha: a porta da NetworkPolicy, que tambem e `port`, fica onde
          # esta. O arquivo inteiro tem tres `port: 8080`, entao a leitura e
          # pelas linhas das sondas, e nao pela contagem da porta.
          sondas() { grep -A3 -E '^ +(readiness|liveness)Probe:$' "$1" | grep -oE 'port: [0-9]+' | paste -sd, -; }
          [ "$(sondas /tmp/render-sem-versao.yaml)" = "port: 8080,port: 8080" ]
          helm template exemplo charts/app \
            --set name=exemplo \
            --set owner=alison \
            --set image.repository=ghcr.io/slipalison/exemplo \
            --set image.tag=sha-abc1234 \
            --set probes.port=9090 > /tmp/render-sondas.yaml
          [ "$(sondas /tmp/render-sondas.yaml)" = "port: 9090,port: 9090" ]
          [ "$(diff /tmp/render-sem-versao.yaml /tmp/render-sondas.yaml | grep -c '^[<>]')" = 4 ]

      - name: Modo preview
        # O preview e o mesmo chart com um bloco a mais. Duas perguntas:
        # producao continua igual, e o preview sai com o que o desenho promete
        # (distros-setup/proxmox/PLANO-PREVIEW.md). O render de producao dos
        # apps reais contra a versao anterior foi conferido byte a byte antes do
        # merge; aqui fica o que da para afirmar sem a versao anterior.
        run: |
          set -euo pipefail
          base=(--set name=exemplo --set owner=alison
                --set image.repository=ghcr.io/slipalison/exemplo
                --set image.tag=sha-abc1234 --set versao=1.2.3
                --set host=exemplo.alisonamorim.com
                --set database.enabled=true --set autoscaling.enabled=true
                --set 'env[0].name=A' --set 'env[0].value=producao'
                --set 'env[1].name=B' --set 'env[1].value=fica')
          helm template exemplo charts/app "${base[@]}" > /tmp/prod.yaml
          # Bloco presente mas vazio = producao, sem uma linha de diferenca.
          helm template exemplo charts/app "${base[@]}" --set preview.numero= > /tmp/prod-vazio.yaml
          diff /tmp/prod.yaml /tmp/prod-vazio.yaml

          helm template pr-42-exemplo charts/app "${base[@]}" \
            --set preview.numero=42 --set preview.tag=pr-42-abcdef0 \
            --set preview.env.A=preview --set preview.env.C=nova > /tmp/pv.yaml
          python3 - <<'FIMPY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/pv.yaml")) if d]
          kinds = sorted(d["kind"] for d in docs)
          por = {d["kind"]: d for d in docs}
          def falha(m): raise SystemExit("FALHA: " + m)
          for d in docs:
              ns = d["metadata"].get("namespace", d["metadata"]["name"])
              if ns != "pr-42-exemplo": falha(f'{d["kind"]} fora do namespace do preview: {ns}')
          for k in ("DatabaseRole", "Database", "PodDisruptionBudget", "HorizontalPodAutoscaler", "AnalysisTemplate"):
              if k in kinds: falha(f"{k} nao existe no preview")
          if "Cluster" not in kinds: falha("banco efemero ausente")
          ro = por["Rollout"]; c = ro["spec"]["template"]["spec"]["containers"][0]
          if ro["spec"]["replicas"] != 1: falha("preview tem uma replica")
          if "blueGreen" not in ro["spec"]["strategy"]: falha("preview nao tem canary")
          if not c["image"].endswith(":pr-42-abcdef0"): falha("imagem do PR")
          env = [(e["name"], e.get("value")) for e in c["env"]]
          nomes = [n for n, _ in env]
          if ("A", "preview") not in env or ("B", "fica") not in env or ("C", "nova") not in env:
              falha(f"preview.env mescla pelo nome: {env}")
          if nomes.count("A") != 1: falha("variavel duplicada")
          if por["VirtualService"]["spec"]["hosts"] != ["pr-42-exemplo.alisonamorim.com"]:
              falha("o host de producao nao pode ir para o preview")
          lab = por["Namespace"]["metadata"]["labels"]
          if "db-access" in lab: falha("o preview nao alcanca o banco de producao")
          if lab.get("preview.alisonamorim.com/origem") != "exemplo": falha("rotulo de origem")
          print("preview ok:", kinds)
          FIMPY

          # E o que o preview tem de RECUSAR, cada um com o seu motivo.
          recusa() { if helm template x charts/app "${base[@]}" "$@" >/dev/null 2>&1; then echo "::error::aceitou: $*"; exit 1; fi; }
          recusa --set preview.numero=42 --set preview.tag=pr-41-abcdef0  # tag de outro PR
          recusa --set preview.numero=42 --set preview.tag=sha-abcdef0    # imagem de producao
          recusa --set preview.numero=42                                  # sem tag
          recusa --set preview.numero=1234 --set preview.tag=pr-1234-abcdef0 \
                 --set name=um-nome-de-aplicacao-comprido-demais         # passa de 40

      - name: preview.secretEnv
        # O preview com credencial propria, de teste: a variavel coberta por
        # `preview.secretEnv` sai com um secretKeyRef para o Secret do preview,
        # e o Secret de producao some do render. Em producao o bloco nao muda
        # uma linha.
        run: |
          set -euo pipefail
          # Um diretorio por run, e nao um caminho fixo: o validar-local roda
          # estes passos no host, onde o /tmp sobrevive entre rodadas.
          export T="${RUNNER_TEMP:-$(mktemp -d)}"
          base=(--set name=exemplo --set owner=equipe
                --set image.repository=ghcr.io/slipalison/exemplo
                --set image.tag=sha-abc1234 --set versao=1.2.3
                --set database.enabled=true
                --set 'env[0].name=CHAVE' --set 'env[0].valueFrom.secretKeyRef.name=exemplo-producao'
                --set 'env[0].valueFrom.secretKeyRef.key=CHAVE'
                --set 'env[1].name=B' --set 'env[1].value=fica')
          seg=(--set preview.secretEnv.CHAVE.secret=exemplo-preview --set preview.secretEnv.CHAVE.key=CHAVE
               --set preview.secretEnv.NOVA.secret=exemplo-preview --set preview.secretEnv.NOVA.key=NOVA
               --set preview.secretEnv.NOVA.optional=true)
          pv=(--set preview.numero=42 --set preview.tag=pr-42-abcdef0)
          helm template exemplo charts/app "${base[@]}" > "$T/seg-prod.yaml"
          helm template exemplo charts/app "${base[@]}" "${seg[@]}" > "$T/seg-prod-com.yaml"
          diff "$T/seg-prod.yaml" "$T/seg-prod-com.yaml"
          helm template pr-42-exemplo charts/app "${base[@]}" "${pv[@]}" > "$T/seg-pv-sem.yaml"
          grep -q 'name: exemplo-producao' "$T/seg-pv-sem.yaml"
          helm template pr-42-exemplo charts/app "${base[@]}" "${pv[@]}" "${seg[@]}" > "$T/seg-pv.yaml"
          if grep -n 'exemplo-producao' "$T/seg-pv.yaml"; then echo "::error::o Secret de producao ficou no preview"; exit 1; fi
          python3 - <<'FIMPY'
          import os, yaml
          T = os.environ["T"]
          docs = [d for d in yaml.safe_load_all(open(f"{T}/seg-pv.yaml")) if d]
          ro = next(d for d in docs if d["kind"] == "Rollout")
          env = {e["name"]: e for e in ro["spec"]["template"]["spec"]["containers"][0]["env"]}
          def falha(m): raise SystemExit("FALHA: " + m)
          if env["CHAVE"].get("valueFrom") != {"secretKeyRef": {"name": "exemplo-preview", "key": "CHAVE"}}: falha(f"CHAVE: {env['CHAVE']}")
          if env["NOVA"].get("valueFrom") != {"secretKeyRef": {"name": "exemplo-preview", "key": "NOVA", "optional": True}}: falha(f"NOVA: {env['NOVA']}")
          if env["B"].get("value") != "fica": falha("B")
          nomes = [e["name"] for e in ro["spec"]["template"]["spec"]["containers"][0]["env"]]
          if len(nomes) != len(set(nomes)): falha(f"variavel duplicada: {nomes}")
          print("secretEnv ok")
          FIMPY
          # Cada recusa pelo SEU motivo: a mensagem esperada tem de aparecer.
          recusa() { local m=$1; shift; local e; if e=$(helm template x charts/app "${base[@]}" "${pv[@]}" "$@" 2>&1 >/dev/null); then echo "::error::aceitou: $*"; exit 1; fi; grep -qF -- "$m" <<<"$e" || { echo "::error::recusou por outro motivo: $e"; exit 1; }; }
          recusa "em preview.env e em preview.secretEnv" --set preview.env.CHAVE=x "${seg[@]}"
          recusa "escrita pelo proprio chart" --set preview.secretEnv.DATABASE_URL.secret=s --set preview.secretEnv.DATABASE_URL.key=k
          recusa "missing property 'key'" --set preview.secretEnv.CHAVE.secret=exemplo-preview
          recusa "additional properties 'outra'" --set preview.secretEnv.CHAVE.secret=s --set preview.secretEnv.CHAVE.key=k --set preview.secretEnv.CHAVE.outra=1

      - name: workers
        # Deployments extras com a mesma imagem. Sem `workers` nada muda; com
        # ele, o worker tem a imagem, o env e os cuidados do app, e nenhuma
        # porta de entrada.
        run: |
          set -euo pipefail
          # Um diretorio por run, e nao um caminho fixo: o validar-local roda
          # estes passos no host, onde o /tmp sobrevive entre rodadas.
          export T="${RUNNER_TEMP:-$(mktemp -d)}"
          base=(--set name=exemplo --set owner=equipe
                --set image.repository=ghcr.io/slipalison/exemplo
                --set image.tag=sha-abc1234 --set versao=1.2.3
                --set database.enabled=true --set probes.port=9090
                --set 'env[0].name=A' --set 'env[0].value=producao')
          wk=(--set 'workers.fila.args[0]=worker' --set 'workers.fila.env[0].name=PAPEL'
              --set 'workers.fila.env[0].value=fila' --set 'workers.fila.env[1].name=A'
              --set 'workers.fila.env[1].value=do-worker' --set workers.fila.database.secret=exemplo-fila-db
              --set workers.fila.resources.requests.cpu=10m --set workers.fila.resources.requests.memory=32Mi
              --set workers.fila.resources.limits.memory=64Mi)
          pv=(--set preview.numero=42 --set preview.tag=pr-42-abcdef0)
          helm template exemplo charts/app "${base[@]}" > "$T/wk-sem.yaml"
          helm template exemplo charts/app "${base[@]}" --set-json 'workers={}' > "$T/wk-vazio.yaml"
          diff "$T/wk-sem.yaml" "$T/wk-vazio.yaml"
          if grep -q '^kind: Deployment$' "$T/wk-sem.yaml"; then echo "::error::Deployment sem workers"; exit 1; fi
          helm template exemplo charts/app "${base[@]}" "${wk[@]}" > "$T/wk.yaml"
          helm template pr-42-exemplo charts/app "${base[@]}" "${wk[@]}" "${pv[@]}" --set preview.env.A=preview > "$T/wk-pv.yaml"
          python3 - <<'FIMPY'
          import os, yaml
          T = os.environ["T"]
          def falha(m): raise SystemExit("FALHA: " + m)
          def carrega(p): return [d for d in yaml.safe_load_all(open(p)) if d]
          for arq, pv in ((f"{T}/wk.yaml", False), (f"{T}/wk-pv.yaml", True)):
              docs = carrega(arq)
              app = "pr-42-exemplo" if pv else "exemplo"
              deps = [d for d in docs if d["kind"] == "Deployment"]
              if [d["metadata"]["name"] for d in deps] != [app + "-fila"]: falha(f"{arq}: deployments {deps}")
              dep = deps[0]; pod = dep["spec"]["template"]; c = pod["spec"]["containers"][0]
              ro = next(d for d in docs if d["kind"] == "Rollout")["spec"]["template"]["spec"]["containers"][0]
              if c["image"] != ro["image"]: falha("a imagem do worker e a do app")
              if c["args"] != ["worker"]: falha("args do worker")
              if [p["containerPort"] for p in c["ports"]] != [9090]: falha("so a porta operacional")
              if c["readinessProbe"]["httpGet"]["port"] != 9090 or c["livenessProbe"]["httpGet"]["port"] != 9090: falha("sondas")
              if pod["spec"]["securityContext"] != next(d for d in docs if d["kind"] == "Rollout")["spec"]["template"]["spec"]["securityContext"]: falha("securityContext do pod")
              if c["securityContext"] != ro["securityContext"]: falha("securityContext do container")
              nomes_ro = [e["name"] for e in ro["env"]]; nomes = [e["name"] for e in c["env"]]
              if nomes != nomes_ro + ["PAPEL"]: falha(f"env do worker: {nomes}")
              env = {e["name"]: e for e in c["env"]}
              esperado_a = "preview" if pv else "do-worker"
              if env["A"].get("value") != esperado_a: falha(f"A: {env['A']}")
              segredo = "banco-app" if pv else "exemplo-fila-db"
              if env["PGUSER"]["valueFrom"]["secretKeyRef"]["name"] != segredo: falha(f"credencial do banco: {env['PGUSER']}")
              if pv and "exemplo-fila-db" in open(arq).read(): falha("credencial de producao do worker no preview")
              if dep["spec"]["replicas"] != 1: falha("replicas")
              svc = next(d for d in docs if d["kind"] == "Service")
              if all(pod["metadata"]["labels"].get(k) == v for k, v in svc["spec"]["selector"].items()): falha("o Service do app alcanca o worker")
              if pod["metadata"]["labels"]["app.kubernetes.io/component"] != "fila": falha("rotulo de componente")
              aps = [d for d in docs if d["kind"] == "AuthorizationPolicy" and d["spec"]["selector"]["matchLabels"] == {"app": app + "-fila"}]
              if len(aps) != 1 or aps[0]["spec"]["rules"] != [{"to": [{"operation": {"ports": ["15020", "15021", "15090"]}}]}]: falha("AuthorizationPolicy do worker")
              if pv:
                  np = next(d for d in docs if d["kind"] == "NetworkPolicy" and d["metadata"]["name"].endswith("-banco"))
                  if not any(r["from"][0].get("podSelector", {}).get("matchExpressions") == [{"key": "app.kubernetes.io/component", "operator": "In", "values": ["fila"]}] for r in np["spec"]["ingress"]): falha("o worker nao alcanca o banco efemero")
          print("workers ok")
          FIMPY
          recusa() { local m=$1; shift; local e; if e=$(helm template x charts/app "${base[@]}" "$@" 2>&1 >/dev/null); then echo "::error::aceitou: $*"; exit 1; fi; grep -qF -- "$m" <<<"$e" || { echo "::error::recusou por outro motivo: $e"; exit 1; }; }
          recusa "falta command ou args" --set workers.fila.replicas=1
          recusa "limits.memory" --set 'workers.fila.args[0]=w' --set workers.fila.resources.requests.cpu=10m
          recusa "escrita pelo proprio chart" --set 'workers.fila.args[0]=w' --set 'workers.fila.env[0].name=DATABASE_URL' --set 'workers.fila.env[0].value=x'
          recusa "invalid propertyName 'migration'" --set 'workers.migration.args[0]=w'
          recusa "invalid propertyName 'Fila'" --set 'workers.Fila.args[0]=w'

      - name: Job de migracao
        # O esquema muda num Job com credencial propria, para o app rodar sem
        # DDL. Producao: gancho PreSync. Preview: gancho Sync depois do banco
        # efemero, com o app uma onda depois. Desligado, nada muda.
        run: |
          set -euo pipefail
          # Um diretorio por run, e nao um caminho fixo: o validar-local roda
          # estes passos no host, onde o /tmp sobrevive entre rodadas.
          export T="${RUNNER_TEMP:-$(mktemp -d)}"
          base=(--set name=exemplo --set owner=equipe
                --set image.repository=ghcr.io/slipalison/exemplo
                --set image.tag=sha-abc1234 --set versao=1.2.3
                --set database.enabled=true
                --set 'env[0].name=SO_DO_APP' --set 'env[0].value=x'
                --set 'envFrom[0].secretRef.name=exemplo-segredos')
          mg=(--set migration.enabled=true --set 'migration.args[0]=migrate'
              --set migration.database.secret=exemplo-dono-db
              --set 'migration.env[0].name=MODO' --set 'migration.env[0].value=migracao')
          pv=(--set preview.numero=42 --set preview.tag=pr-42-abcdef0)
          helm template exemplo charts/app "${base[@]}" > "$T/mg-sem.yaml"
          helm template exemplo charts/app "${base[@]}" --set migration.enabled=false --set 'migration.args[0]=migrate' > "$T/mg-desligado.yaml"
          diff "$T/mg-sem.yaml" "$T/mg-desligado.yaml"
          helm template pr-42-exemplo charts/app "${base[@]}" "${pv[@]}" > "$T/mg-pv-sem.yaml"
          if grep -q '^kind: Job$' "$T/mg-sem.yaml" "$T/mg-pv-sem.yaml"; then echo "::error::Job sem migration"; exit 1; fi
          helm template exemplo charts/app "${base[@]}" "${mg[@]}" > "$T/mg.yaml"
          helm template pr-42-exemplo charts/app "${base[@]}" "${mg[@]}" "${pv[@]}" --set 'workers.fila.args[0]=w' > "$T/mg-pv.yaml"
          python3 - <<'FIMPY'
          import os, yaml
          T = os.environ["T"]
          def falha(m): raise SystemExit("FALHA: " + m)
          for arq, pv in ((f"{T}/mg.yaml", False), (f"{T}/mg-pv.yaml", True)):
              docs = [d for d in yaml.safe_load_all(open(arq)) if d]
              app = "pr-42-exemplo" if pv else "exemplo"
              jobs = [d for d in docs if d["kind"] == "Job"]
              if [j["metadata"]["name"] for j in jobs] != [app + "-migration"]: falha(f"{arq}: jobs")
              j = jobs[0]; an = j["metadata"]["annotations"]; pod = j["spec"]["template"]
              c = pod["spec"]["containers"][0]
              ro = next(d for d in docs if d["kind"] == "Rollout")
              if an.get("argocd.argoproj.io/hook-delete-policy") != "BeforeHookCreation": falha("apaga o Job anterior")
              if pv:
                  if an.get("argocd.argoproj.io/hook") != "Sync" or an.get("argocd.argoproj.io/sync-wave") != "1": falha(f"gancho do preview: {an}")
                  for d in docs:
                      if d["kind"] in ("Rollout", "Deployment") and d["metadata"].get("annotations", {}).get("argocd.argoproj.io/sync-wave") != "2":
                          falha(f"{d['kind']} tem de vir depois da migracao")
              else:
                  if an.get("argocd.argoproj.io/hook") != "PreSync" or "argocd.argoproj.io/sync-wave" in an: falha(f"gancho de producao: {an}")
                  if "annotations" in ro["metadata"]: falha("o Rollout de producao nao muda")
              if c["image"] != ro["spec"]["template"]["spec"]["containers"][0]["image"]: falha("a imagem e a do app")
              if c["args"] != ["migrate"]: falha("args")
              if pod["spec"]["restartPolicy"] != "Never": falha("restartPolicy")
              if pod["metadata"]["annotations"] != {"sidecar.istio.io/nativeSidecar": "true"}: falha("sidecar nativo, senao o Job nao termina")
              if pod["spec"]["securityContext"] != ro["spec"]["template"]["spec"]["securityContext"]: falha("securityContext")
              if "envFrom" in c: falha("o Job nao recebe o envFrom do app")
              env = {e["name"]: e for e in c["env"]}
              if "SO_DO_APP" in env: falha("o Job nao recebe o env do app")
              if env.get("MODO", {}).get("value") != "migracao": falha("env proprio")
              segredo = "banco-app" if pv else "exemplo-dono-db"
              for k in ("PGUSER", "PGPASSWORD"):
                  if env[k]["valueFrom"]["secretKeyRef"]["name"] != segredo: falha(f"{k}: {env[k]}")
              if not pv and env["DATABASE_URL"]["valueFrom"]["secretKeyRef"]["name"] != segredo: falha("DATABASE_URL")
              if pv and "exemplo-dono-db" in open(arq).read(): falha("credencial de producao da migracao no preview")
              aps = [d for d in docs if d["kind"] == "AuthorizationPolicy" and d["spec"]["selector"]["matchLabels"] == {"app": app + "-migration"}]
              if len(aps) != 1: falha("AuthorizationPolicy do Job")
              if pv:
                  np = next(d for d in docs if d["kind"] == "NetworkPolicy" and d["metadata"]["name"].endswith("-banco"))
                  if not any(r["from"][0].get("podSelector", {}).get("matchExpressions") == [{"key": "app.kubernetes.io/component", "operator": "In", "values": ["fila", "migration"]}] for r in np["spec"]["ingress"]): falha("a migracao nao alcanca o banco efemero")
          print("migracao ok")
          FIMPY
          recusa() { local m=$1; shift; local e; if e=$(helm template x charts/app "${base[@]}" "$@" 2>&1 >/dev/null); then echo "::error::aceitou: $*"; exit 1; fi; grep -qF -- "$m" <<<"$e" || { echo "::error::recusou por outro motivo: $e"; exit 1; }; }
          recusa "exige database.enabled" "${mg[@]}" --set database.enabled=false
          recusa "falta command ou args" --set migration.enabled=true --set migration.database.secret=s
          recusa "migration.database.secret e obrigatorio" --set migration.enabled=true --set 'migration.args[0]=m'
          recusa "escrita pelo proprio chart" "${mg[@]}" --set 'migration.env[0].name=PGUSER'
          recusa "limits.memory" "${mg[@]}" --set migration.resources.requests.cpu=1m

      - name: Politicas do Kyverno nos pods
        # O cluster recusa, em Enforce, o POD sem requests/limits, com
        # :latest, como root, de registro desconhecido, e o workload sem os
        # rotulos de dono. Quatro delas olham o pod: o apply sai verde e o pod
        # e que nao nasce. O conferidor le cada modelo de pod do render e e
        # provado pela isca antes (um defeito plantado por vez).
        run: |
          set -euo pipefail
          bash .github/scripts/conferir-pods-isca.sh
          export T="${RUNNER_TEMP:-$(mktemp -d)}"
          base=(--set name=exemplo --set owner=equipe
                --set image.repository=ghcr.io/slipalison/exemplo
                --set image.tag=sha-abc1234 --set database.enabled=true)
          tudo=(--set 'workers.fila.args[0]=w' --set migration.enabled=true
                --set 'migration.args[0]=m' --set migration.database.secret=s)
          pv=(--set preview.numero=42 --set preview.tag=pr-42-abcdef0)
          helm template exemplo charts/app "${base[@]}" > "$T/k-prod.yaml"
          helm template exemplo charts/app "${base[@]}" "${tudo[@]}" > "$T/k-tudo.yaml"
          helm template pr-42-exemplo charts/app "${base[@]}" "${pv[@]}" > "$T/k-pv.yaml"
          helm template pr-42-exemplo charts/app "${base[@]}" "${tudo[@]}" "${pv[@]}" > "$T/k-pv-tudo.yaml"
          python3 .github/scripts/conferir-pods.py "$T"/k-*.yaml

  publicar:
    name: Publicar OCI
    needs: [versao, lint]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.versao.outputs.salto != 'nenhum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Login no GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login ghcr.io -u "$USUARIO" --password-stdin
      - name: Empacotar e enviar
        env:
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          set -euo pipefail
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versao invalida: $VERSAO"; exit 1; }
          helm package charts/app --version "$VERSAO"
          helm push "app-$VERSAO.tgz" oci://ghcr.io/slipalison/charts
          {
            echo "## Chart"
            echo ""
            echo "\`oci://ghcr.io/slipalison/charts/app\` versao **$VERSAO**"
            echo ""
            echo "Para usar: \`targetRevision: $VERSAO\` em apps/applicationset.yaml do homelab-gitops — o unico lugar; o validar-apps e o ApplicationSet previews leem dali."
          } >> "$GITHUB_STEP_SUMMARY"

  lancar:
    # Depois do pacote: a tag e a prova de que aquela versao esta no GHCR.
    needs: [versao, lint, publicar]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.versao.outputs.salto != 'nenhum'
    permissions:
      contents: write
      packages: write
    uses: slipalison/github-workflows/.github/workflows/lancar.yml@main
    with:
      versao: ${{ needs.versao.outputs.versao }}
      tag: ${{ needs.versao.outputs.tag }}
