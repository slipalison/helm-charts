name: Publicar charts

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'charts/**'

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint e template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/app
      - name: helm template com os valores de exemplo
        # Lint nao renderiza. Um template que so quebra com valores reais passa
        # pelo lint sem reclamar.
        run: |
          helm template exemplo charts/app \
            --set name=exemplo \
            --set owner=alison \
            --set image.repository=ghcr.io/slipalison/exemplo \
            --set image.tag=sha-abc1234 > /dev/null

  publicar:
    name: Publicar OCI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Login no GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Empacotar e enviar
        run: |
          versao="${GITHUB_REF_NAME#v}"
          helm package charts/app --version "$versao"
          helm push "app-${versao}.tgz" oci://ghcr.io/slipalison/charts
